[package]
name = "notedd-editor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
notedd-core = { path = "../core" }
unicode-segmentation = "1.13"

[dev-dependencies]
# a reference reader: the tests check that what Notedd writes means the same to a standard CommonMark parser
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
