name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            setup

      - name: Build app
        working-directory: app
        run: cargo build --release --locked

      - name: Test shared core
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Test app
        working-directory: app
        run: cargo test --locked

      - name: Build installer
        working-directory: setup
        run: cargo build --release --locked

      - name: Test installer
        working-directory: setup
        run: cargo test --locked

      - uses: actions/upload-artifact@v4
        with:
          name: notedd-setup
          path: setup/target/release/notedd-setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal app and installer
        run: ./macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: notedd-setup-macos
          path: macos/target/notedd-setup-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: notedd-setup-macos

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: notedd-setup-macos.zip
