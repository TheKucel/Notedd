name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            editor
            setup

      - name: Test shared core
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Test editor
        run: cargo test --locked --manifest-path editor/Cargo.toml

      - name: Build app
        run: cargo build --release --locked --manifest-path app/Cargo.toml

      - name: Build installer
        run: cargo build --release --locked --manifest-path setup/Cargo.toml

      - name: Test installer
        run: cargo test --locked --manifest-path setup/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: notedd-setup
          path: setup/target/release/notedd-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build universal Notedd.app
        run: ./app/macos/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: notedd-macos
          path: app/target/macos/notedd-setup-macos.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build app
        run: cargo build --release --locked --manifest-path app/Cargo.toml

      - name: Pack
        run: |
          mkdir -p notedd
          cp app/target/release/notedd assets/notedd.svg LICENSE notedd/
          tar -czf notedd-linux-x86_64.tar.gz notedd

      - uses: actions/upload-artifact@v4
        with:
          name: notedd-linux
          path: notedd-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: notedd-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            notedd-setup.exe
            notedd-setup-macos.zip
            notedd-linux-x86_64.tar.gz
